services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      MONGODB_URI: ${MONGODB_URI}
      NODE_ENV: production
      PORT: 5000
    ports:
      - "${BACKEND_HOST_PORT:-5000}:5000"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
